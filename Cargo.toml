[package]
name = "nonce-guard-program"
version = "0.1.0"
edition = "2024"

[package.metadata.solana]
program-id = "guardgkc38afzaHQ7LNAtWHKgdUAAwyayhNdY8MPNnw"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pinocchio = { version = "0.10.2", features = ["cpi"] }
p-never-nonce = "0.2.0"
borsh = { version = "1.8.1", features = ["derive"] }
solana-address = { version = "2.7.0", features = ["curve25519", "decode"] }

[dev-dependencies]
litesvm = "0.18.1"
solana-account = "4.7.0"
solana-instruction = "3.5.1"
solana-keypair = "3.1.2"
solana-message = "4.6.0"
solana-nonce = "3.3.0"
solana-pubkey = "4.0.0"
solana-rent = "4.4.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = "3.3.0"
solana-transaction = "4.3.0"
solana-transaction-error = "3.4.0"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(exe)'] }
