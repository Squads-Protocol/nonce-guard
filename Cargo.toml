[package]
name = "nonce-guard-program"
version = "0.1.0"
edition = "2024"

[package.metadata.solana]
program-id = "guardgkc38afzaHQ7LNAtWHKgdUAAwyayhNdY8MPNnw"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pinocchio = { version = "0.10.2", features = ["cpi"] }
p-never-nonce = "0.2.0"
borsh = { version = "1.5.7", features = ["derive"] }
solana-address = { version = "2.5.0", features = ["curve25519", "decode"] }

[dev-dependencies]
litesvm = "0.6.1"
solana-account = "2.2.1"
solana-instruction = "2.2.1"
solana-keypair = "2.2.1"
solana-message = "2.2.1"
solana-nonce = "2.2.1"
solana-pubkey = "2.2.1"
solana-rent = "2.2.1"
solana-sdk-ids = "2.2.1"
solana-signer = "2.2.1"
solana-system-interface = "1.0.0"
solana-transaction = "2.2.1"
solana-transaction-error = "2.2.1"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(exe)'] }
