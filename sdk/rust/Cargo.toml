[package]
name = "nonce-guard-client"
version = "0.1.0"
edition = "2021"
description = "Rust client for the Nonce Guard program"
license = "MIT"

[lib]
name = "nonce_guard_client"

[dependencies]
borsh = { version = "1", features = ["derive"] }
kaigan = ">=0.2.6"

solana-address = { version = "~2.9", features = ["decode"] }
solana-instruction = "~4.0"
solana-account-info = "~3.1"
solana-cpi = "~3.1"
solana-program-error = "3"
spl-collections = { version = "0.1", features = ["borsh"] }

num-derive = "0.5"
num-traits = "0.2"
thiserror = "2"

[features]
default = []
serde = ["dep:serde"]

[dependencies.serde]
version = "1"
optional = true
